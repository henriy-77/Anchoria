[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SHARED_SECRET"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# The Individual form is retired — send any bookmarked/indexed links to
# the external customer signup flow instead of a 404.
[[redirects]]
  from = "/accountopening.html"
  to = "https://app.anchoriang.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/individualaccountopening.html"
  to = "https://app.anchoriang.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/corporate-opening.html"
  to = "/corporateaccountopening.html"
  status = 301
  force = true


[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/account-opening.html"
  [headers.values]
    # Allow embedding via iframe from the main Anchoria site
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"
